[package]
name = "foreverdb-client"
version = "0.2.0"
description = "Lädt ForeverCollect-SavedVariables aus World of Warcraft zu ForeverDB hoch"
authors = ["Alex Bangert"]
license = "MIT"
homepage = "https://github.com/alexbangert/foreverdb"
repository = "https://github.com/alexbangert/foreverdb"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "foreverdb_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

# Windows only: canonical paths, the launcher's registry entries, process list.
[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1"
winreg = { version = "0.55", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
