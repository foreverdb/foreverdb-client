[package]
name = "forevercollect-lua-wasm"
version = "0.1.0"
description = "The ForeverCollect SavedVariables parser as WASM, for the browser upload on the website"
authors = ["Alex Bangert"]
license = "MIT"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forevercollect-lua = { path = "../forevercollect-lua" }
serde_json = "1"
# Pinned: wasm-bindgen-cli must have exactly this version (release workflow, README).
wasm-bindgen = "=0.2.130"
