name: Release

# Started by hand (Actions → Release → Run workflow). Builds the Linux packages
# (deb, rpm, AppImage) and the Windows installer for the version in
# src-tauri/tauri.conf.json and attaches them to the release "v<version>".
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check versions
        id: version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          package=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          pkgbuild=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          echo "tauri.conf.json=$version package.json=$package Cargo.toml=$cargo PKGBUILD=$pkgbuild"
          if [ "$package" != "$version" ] || [ "$cargo" != "$version" ] || [ "$pkgbuild" != "$version" ]; then
            echo "::error::Versions differ; keep package.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json and packaging/arch/PKGBUILD in sync."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; bump the version first."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release $tag already exists (possibly a draft); delete it or bump the version."
            exit 1
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement of the AppImage low.
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev build-essential rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The tests compile the app, which embeds the built frontend from dist/.
      - name: Build frontend
        run: pnpm build

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: v__VERSION__
          releaseName: ForeverDB Uploader v__VERSION__
          releaseBody: See the assets below to download and install ForeverDB Uploader v__VERSION__.
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
